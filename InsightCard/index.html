<!doctype html>
<html lang="es" data-theme="light">
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Prompt:wght@400;500&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>InsightCard — preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" data-auto-replace-svg="nest"></script>
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans);}
.sec{margin-bottom:28px}.sec:last-child{margin-bottom:0}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac-ink-2);margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sz{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac-ink-3)}
.tools{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0}
.cnt{font-size:12px;font-weight:700;color:var(--ac-ink-3)}
</style>
<style>@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)!important}}</style></head>
<body><div id="ds-nav" style="position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;padding:10px 24px;background:#151f47;color:#fff;font:700 13px Nunito,sans-serif"><a href="../" style="color:#fff;text-decoration:none">&larr; Actuaria Design System</a><span style="opacity:.6">/</span><span>InsightCard</span></div>
<div id="root"></div>
<script>
var A = window.ActuariaDesignSystem_88aa6b, h = React.createElement;

function Sec(p){ return h('div',{className:'sec'}, h('div',{className:'lbl'}, p.title, p.tools), p.children); }
function Tools(p){ return h('span',{className:'tools'},
  h(A.Button,{size:'sm',variant:'secondary',icon:'fa-solid fa-plus',onClick:p.onAdd,disabled:!!p.max&&p.n>=p.max},p.add),
  h(A.Button,{size:'sm',variant:'ghost',icon:'fa-solid fa-minus',onClick:p.onRemove,disabled:p.n<=(p.min||0)},'Quitar'),
  h('span',{className:'cnt'},p.n+' '+p.noun)); }
function Sz(p){ return h('div',{className:'col',style:p.style},h('span',{className:'sz'},p.n),p.children); }


var INS=[
 {tone:'positive',title:'Provisión en tendencia positiva',body:'La reserva total creció 4.2% vs 2023 y cubre las obligaciones proyectadas.',act:'Ver proyecciones'},
 {tone:'attention',title:'Concentración en quinquenios tempranos',body:'El 69% de los partícipes lleva menos de 15 años de servicio.',act:'Simular escenarios'},
 {tone:'alert',title:'Brecha demográfica de género',body:'Solo el 12% de los partícipes son mujeres (152 de 1,297).',act:'Revisar supuestos'},
 {tone:'positive',title:'Rotación bajo el promedio',body:'La rotación anual fue 6.1%, por debajo del 8.4% del sector.',act:'Ver detalle'},
 {tone:'attention',title:'Vencimiento de supuestos',body:'Las tablas de mortalidad llevan 3 años sin actualizarse.',act:'Actualizar'},
 {tone:'alert',title:'Datos de nómina incompletos',body:'Faltan fechas de ingreso en 38 registros.',act:'Corregir'}];
var W={sm:220,md:280,lg:340};
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function Demo(){ var st=React.useState(3), n=st[0], setN=st[1], cards=[];
  for(var i=0;i<n;i++){ var c=INS[i%INS.length]; cards.push(h(A.InsightCard,{key:i,tone:c.tone,title:c.title,actionLabel:c.act},c.body)); }
  return h('div',null,
    h(Sec,{title:'Tamaños'},h('div',{className:'row'},
      ['sm','md','lg'].map(function(s){ var c=INS[0]; return h(Sz,{key:s,n:s,style:{width:W[s]}},
        h(A.InsightCard,{size:s,tone:c.tone,title:c.title,actionLabel:c.act,style:{width:'100%'}},c.body)); }))),
    h(Sec,{title:'Tablero de lecturas',tools:h(Tools,{n:n,min:1,max:12,noun:'tarjetas',add:'Agregar tarjeta',onAdd:function(){setN(clamp(n+1,1,12));},onRemove:function(){setN(clamp(n-1,1,12));}})},
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:14,alignItems:'stretch'}},cards))); }

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
