<!doctype html>
<html lang="es" data-theme="light">
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Prompt:wght@400;500&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Button — preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" data-auto-replace-svg="nest"></script>
<style>body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);}
.sec{margin-bottom:28px}.sec:last-child{margin-bottom:0}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac-ink-2);margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sz{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac-ink-3)}
.tools{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0}
.cnt{font-size:12px;font-weight:700;color:var(--ac-ink-3)}
</style>
<style>@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)!important}}</style></head>
<body><div id="ds-nav" style="position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;padding:10px 24px;background:#151f47;color:#fff;font:700 13px Nunito,sans-serif"><a href="../" style="color:#fff;text-decoration:none">&larr; Actuaria Design System</a><span style="opacity:.6">/</span><span>Button</span></div>
<div id="root"></div>
<script>
var A = window.ActuariaDesignSystem_88aa6b, h = React.createElement;

function Sec(p){ return h('div',{className:'sec'}, h('div',{className:'lbl'}, p.title, p.tools), p.children); }
function Tools(p){ return h('span',{className:'tools'},
  h(A.Button,{size:'sm',variant:'secondary',icon:'fa-solid fa-plus',onClick:p.onAdd,disabled:!!p.max&&p.n>=p.max},p.add),
  h(A.Button,{size:'sm',variant:'ghost',icon:'fa-solid fa-minus',onClick:p.onRemove,disabled:p.n<=(p.min||0)},'Quitar'),
  h('span',{className:'cnt'},p.n+' '+p.noun)); }
function Sz(p){ return h('div',{className:'col',style:p.style},h('span',{className:'sz'},p.n),p.children); }


function Demo(){ var VAR=[['primary','Continuar','fa-solid fa-arrow-right'],['accent','Descargar','fa-solid fa-download'],['secondary','Cancelar',null],['ghost','Filtrar','fa-solid fa-filter']];
  return h('div',null,
    h(Sec,{title:'Tamaños × variantes'},h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      ['sm','md','lg'].map(function(s){ return h(Sz,{key:s,n:s+(s==='sm'?' · 34 px':s==='md'?' · 42 px':' · 50 px')},
        h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}},
          VAR.map(function(v){ return h(A.Button,{key:v[0],size:s,variant:v[0],icon:v[2]||undefined,iconRight:!!v[2]&&v[0]==='primary'},v[1]); }),
          h(A.Button,{size:s,variant:'primary',loading:true},'Procesando'),
          h(A.Button,{size:s,variant:'primary',disabled:true},'Bloqueado'))); }))),
    h(Sec,{title:'Neomórfico (estilo base de producto)'},
      h('div',{style:{background:'var(--neu-surface)',padding:20,borderRadius:'var(--neu-radius)',display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}},
        ['sm','md','lg'].map(function(s){ return h(A.Button,{key:s,size:s,variant:'neu',icon:'fa-solid fa-sliders'},'Ajustes '+s); })))); }

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
