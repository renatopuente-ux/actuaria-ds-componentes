<!doctype html><html lang="es" data-theme="light"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Prompt:wght@400;500&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Imagotipo ®</title>
<style>
  body{margin:0;padding:0;background:var(--surface-card);font-family:var(--font-heading);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);}
  .tile{min-height:200px;display:flex;align-items:center;justify-content:center;position:relative;border-right:1px solid var(--ac-line);}
  .tile:last-child{border-right:none;}
  .tile img{width:132px;height:auto;}

  .dark{background:var(--ac-navy);}
  .dark .tl{color:var(--text-on-dark-muted);}
  .sizes{display:flex;align-items:flex-end;gap:48px;flex-wrap:wrap;padding:28px 24px 30px;border-top:1px solid var(--ac-line);}
  .sizes figure{margin:0;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:100%;}
  .sizes figcaption{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac-ink-3);}
  .sizes img{height:auto;display:block;max-width:100%;}

    <figure><img src="../assets/imagotipo.svg" alt="Actuaria" style="width:180px"><figcaption>Mínimo digital · 180 px</figcaption></figure>
