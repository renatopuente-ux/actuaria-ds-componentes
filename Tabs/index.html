<!doctype html>
<html lang="es" data-theme="light">
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Prompt:wght@400;500&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Tabs — preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" data-auto-replace-svg="nest"></script>
<style>body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);}
.sec{margin-bottom:28px}.sec:last-child{margin-bottom:0}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac-ink-2);margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sz{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac-ink-3)}
.tools{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0}
.cnt{font-size:12px;font-weight:700;color:var(--ac-ink-3)}
</style>
<style>@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)!important}}</style></head>
<body><div id="ds-nav" style="position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;padding:10px 24px;background:#151f47;color:#fff;font:700 13px Nunito,sans-serif"><a href="../" style="color:#fff;text-decoration:none">&larr; Actuaria Design System</a><span style="opacity:.6">/</span><span>Tabs</span></div>
<div id="root"></div>
<script>
var A = window.ActuariaDesignSystem_88aa6b, h = React.createElement;

function Sec(p){ return h('div',{className:'sec'}, h('div',{className:'lbl'}, p.title, p.tools), p.children); }
function Tools(p){ return h('span',{className:'tools'},
  h(A.Button,{size:'sm',variant:'secondary',icon:'fa-solid fa-plus',onClick:p.onAdd,disabled:!!p.max&&p.n>=p.max},p.add),
  h(A.Button,{size:'sm',variant:'ghost',icon:'fa-solid fa-minus',onClick:p.onRemove,disabled:p.n<=(p.min||0)},'Quitar'),
  h('span',{className:'cnt'},p.n+' '+p.noun)); }
function Sz(p){ return h('div',{className:'col',style:p.style},h('span',{className:'sz'},p.n),p.children); }


var NAMES=['Resumen','Partícipes','Actas de jubilación','Supuestos','Proyecciones','Escenarios','Reportes','Historial','Documentos','Auditoría','Alertas','Usuarios','Ajustes','Ayuda'];
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function mk(n){ var t=[]; for(var i=0;i<n;i++) t.push({id:'t'+i,label:NAMES[i%NAMES.length]+(i>=NAMES.length?' '+(Math.floor(i/NAMES.length)+1):''),count:i===1?1297:undefined,icon:i===0?'fa-solid fa-chart-pie':undefined}); return t; }
function Demo(){ var sn=React.useState(4), n=sn[0], setN=sn[1], sv=React.useState('t0'), v=sv[0], setV=sv[1], tabs=mk(n);
  var cur=tabs.some(function(t){return t.id===v;})?v:'t0';
  return h('div',null,
    h(Sec,{title:'Tamaños'},h('div',{style:{display:'flex',flexDirection:'column',gap:18}},
      ['sm','md','lg'].map(function(s){ return h(Sz,{key:s,n:s,style:{width:'100%'}},h(A.Tabs,{size:s,defaultValue:'resumen',style:{width:'100%'},tabs:[{id:'resumen',label:'Resumen',icon:'fa-solid fa-chart-pie'},{id:'partic',label:'Partícipes',count:1297},{id:'actas',label:'Actas de jubilación'},{id:'sup',label:'Supuestos'}]})); }))),
    h(Sec,{title:'Muchas pestañas (la barra se desplaza)',tools:h(Tools,{n:n,min:1,max:30,noun:'pestañas',add:'Agregar pestaña',onAdd:function(){setN(clamp(n+1,1,30));},onRemove:function(){setN(clamp(n-1,1,30));}})},
      h('div',{style:{maxWidth:560}},h(A.Tabs,{tabs:tabs,value:cur,onChange:setV})))); }

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
